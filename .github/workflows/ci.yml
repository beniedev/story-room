name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build hosted/device bundle
        run: npm run build
      - name: Build local-host bundle
        run: npm run build:local

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITLEAKS_VERSION: 8.28.0
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Scan privacy-sensitive content
        run: npm run privacy:scan
      - name: Check direct dependency licenses
        run: npm run license:check
